<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 評語小幫手</title>
<style>
  :root{
    --bg:#241C1E;
    --ink:#E8DCC8;
    --card:#1E1A1C;
    --c-pinxing:#C11F44;
    --c-shenghuo:#17967F;
    --c-xuexiao:#1D5FC7;
    --c-renji:#C6841A;
    --c-xueye:#5B31C4;
    --c-fuwu:#B5451E;
    --c-zhuanzhu:#A98A1A;
    --s60:#2F6B3E;
    --s70:#1E7A6E;
    --s80:#7A1F3D;
    --s90:#8A2E1E;
    --s100:#D4A017;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"PingFang TC","Microsoft JhengHei","Heiti TC","Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 8% 15%, #F3B8CE 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #A9D9B0 0%, transparent 45%),
      radial-gradient(circle at 88% 88%, #D9A857 0%, transparent 50%),
      radial-gradient(circle at 10% 90%, #E8B15A 0%, transparent 45%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;position:relative;z-index:1;}

  .mascot-watermark{
    position:fixed;
    left:75%;
    bottom:-10px;
    width:300px;
    max-width:38vw;
    opacity:0.1;
    pointer-events:none;
    z-index:0;
    transform:translateX(-50%) rotate(-4deg);
  }
  .mascot-watermark svg{width:100%;height:auto;display:block;}
  @media (max-width:600px){
    .mascot-watermark{width:220px;max-width:55vw;bottom:0;left:75%;}
  }

  header{text-align:center;margin-bottom:30px;}
  header h1{
    font-size:clamp(26px,7vw,42px);
    margin:0 0 6px;
    font-weight:900;
    letter-spacing:1px;
    color:#FF6FA0;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.55);
    word-break:keep-all;
    white-space:nowrap;
  }
  header p{margin:0;font-size:15px;color:#C9B79A;overflow-wrap:break-word;}
  @media (max-width:420px){
    header h1{font-size:clamp(22px,6.5vw,42px);letter-spacing:0px;}
  }

  .panel{
    background:var(--card);
    border-radius:26px;
    padding:22px 22px 26px;
    margin-bottom:22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    border:2px dashed #FFD9E8;
  }
  .panel h2{
    font-size:16px;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
    color:#D9C6A8;
  }
  .badge-step{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:24px;height:24px;
    border-radius:50%;
    background:#C11F44;
    color:#fff;
    font-size:13px;
    font-weight:700;
  }

  .chip-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
  .chip{
    border:none;
    cursor:pointer;
    padding:13px 20px;
    border-radius:18px;
    font-size:18px;
    font-weight:700;
    color:#fff;
    opacity:0.38;
    transform:scale(0.97);
    transition:all .18s ease;
    display:flex;align-items:center;gap:6px;
    box-shadow:0 4px 0 rgba(0,0,0,0.08);
  }
  .chip:hover{opacity:0.7;}
  .chip.active{opacity:1;transform:scale(1.04) rotate(-1deg);box-shadow:0 5px 0 rgba(0,0,0,0.15);}
  .chip[data-cat="品行"]{background:var(--c-pinxing);}
  .chip[data-cat="生活"]{background:var(--c-shenghuo);}
  .chip[data-cat="學校"]{background:var(--c-xuexiao);}
  .chip[data-cat="人際"]{background:var(--c-renji);}
  .chip[data-cat="學業"]{background:var(--c-xueye);}
  .chip[data-cat="服務"]{background:var(--c-fuwu);}
  .chip[data-cat="專注"]{background:var(--c-zhuanzhu);}

  .stage-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;}
  .stage{
    border:none;cursor:pointer;
    width:132px;
    padding:14px 8px 12px;
    border-radius:18px;
    text-align:center;
    color:#fff;
    font-weight:700;
    opacity:0.4;
    transform:scale(0.95) rotate(0deg);
    transition:all .18s ease;
    box-shadow:0 4px 0 rgba(0,0,0,0.1);
  }
  .stage:hover{opacity:0.75;}
  .stage.active{opacity:1;transform:scale(1.08) rotate(-2deg);box-shadow:0 6px 0 rgba(0,0,0,0.18);}
  .stage .top-row{display:flex;align-items:center;justify-content:center;gap:6px;}
  .stage .emoji{font-size:28px;display:inline-block;}
  .stage .num{font-size:22px;display:inline-block;line-height:1;}
  .stage .label{font-size:22px;opacity:0.9;display:block;margin-top:4px;white-space:nowrap;}
  .stage .mobile-break{display:none;}
  .stage[data-score="60"]{background:var(--s60);}
  .stage[data-score="70"]{background:var(--s70);}
  .stage[data-score="80"]{background:var(--s80);}
  .stage[data-score="90"]{background:var(--s90);}
  .stage[data-score="100"]{background:var(--s100);}

  .generate-wrap{text-align:center;margin:26px 0;}
  #genBtn{
    border:none;cursor:pointer;
    background:linear-gradient(135deg,#FF6FA0,#FFAA3D);
    color:#fff;font-size:19px;font-weight:900;
    padding:16px 44px;
    border-radius:30px;
    box-shadow:0 8px 0 #E8578A;
    letter-spacing:2px;
    transition:transform .12s ease;
  }
  #genBtn:active{transform:translateY(6px);box-shadow:0 2px 0 #E8578A;}
  #hint{color:#C2A67E;font-size:13px;margin-top:10px;min-height:18px;}

  #results{display:flex;justify-content:center;}
  .result-card{
    background:var(--card);
    border-radius:22px;
    padding:0;
    overflow:hidden;
    box-shadow:0 10px 26px rgba(0,0,0,0.35);
    width:100%;
    max-width:780px;
    margin:0 auto;
  }
  .result-card .tape{
    padding:14px 20px;
    color:#fff;font-weight:800;font-size:15px;
    text-align:center;
    background:linear-gradient(135deg,#FF6FA0,#9B7EDE);
    letter-spacing:1px;
  }
  .result-card .body{padding:20px 22px 22px;}
  .entry{padding:14px 0;border-bottom:1px dashed #3A302C;}
  .entry:last-of-type{border-bottom:none;}
  .entry-head{
    display:flex;align-items:center;gap:8px;
    font-size:13.5px;font-weight:800;color:#D9C6A8;
    margin-bottom:8px;
  }
  .entry-head .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .result-card p{
    margin:0 0 10px;
    font-size:16px;
    line-height:1.8;
    color:#EDE0CC;
    text-align:center;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  .card-actions{display:flex;gap:8px;justify-content:center;}
  .mini-btn{
    border:none;cursor:pointer;
    background:#2A2224;
    color:#D8C0A0;
    font-size:12.5px;
    font-weight:700;
    padding:7px 12px;
    border-radius:12px;
    transition:background .15s;
  }
  .mini-btn:hover{background:#3A302C;}

  .card-footer{
    text-align:center;
    margin-top:6px;
    padding-top:16px;
    border-top:2px dashed #3A302C;
  }
  .copy-all-btn{
    border:none;cursor:pointer;
    background:#5B8DEF;color:#fff;
    font-weight:700;font-size:14px;
    padding:11px 26px;border-radius:20px;
    box-shadow:0 5px 0 #3E6BC4;
  }
  .copy-all-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3E6BC4;}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#4A3B2A;color:#fff;padding:10px 22px;border-radius:16px;
    font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s ease;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer{text-align:center;margin-top:36px;font-size:12.5px;color:#C9B394;line-height:1.9;word-break:keep-all;overflow-wrap:break-word;}
  footer b{color:#E3CFA9;}
  .credit-tag{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:14px;
    padding:6px 16px;
    border-radius:14px;
    background:#2A2224;
    color:#D8C0A0;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.5px;
  }

  @media (max-width:480px){
    .panel{padding:18px 14px 20px;}
  }

  /* ===== 手機版專用布局(大幅重新設計,而非電腦版縮小版) ===== */
  @media (max-width:600px){
    /* 選擇項目:改成單欄列表,左側圖示、右側文字,滿版寬度,不會有換行問題 */
    .chip-row{flex-direction:column;gap:10px;}
    .chip{
      width:100%;
      justify-content:flex-start;
      padding:14px 18px;
      font-size:16px;
      white-space:nowrap;
      border-radius:16px;
      gap:10px;
    }
    .chip .icon-badge{
      display:inline-flex;align-items:center;justify-content:center;
      width:30px;height:30px;border-radius:50%;
      background:rgba(255,255,255,0.28);
      font-size:16px;flex-shrink:0;
    }

    /* 選擇成長階段:改成單排五欄的精簡版,拿掉容易換行的長文字說明 */
    .stage-row{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:6px;
    }
    .stage{
      width:100%;
      padding:10px 2px 8px;
      border-radius:14px;
    }
    .stage .top-row{flex-direction:column;gap:0;}
    .stage .emoji{font-size:19px;margin-bottom:2px;}
    .stage .num{font-size:15px;}
    .stage .label{font-size:9px;line-height:1.25;margin-top:2px;}
    .stage .mobile-break{display:block;}

    /* 評語文字:改成一般斷行(不限標點)+齊行,讓每行字數平均,最後一行維持置中 */
    .result-card p{
      word-break:normal;
      text-align:justify;
      text-align-last:center;
    }
  }
</style>
</head>
<body>

<div class="mascot-watermark" aria-hidden="true">

</div>

<div class="wrap">

  <header>
    <h1>🌈 評語小幫手</h1>
    <p>點一點,幫每個孩子寫出被看見的正向評語 ✨</p>
  </header>

  <div class="panel">
    <h2><span class="badge-step">1</span>選擇項目(可複選)</h2>
    <div class="chip-row" id="catRow">
      <button class="chip" data-cat="品行"><span class="icon-badge">🌟</span> 品行</button>
      <button class="chip" data-cat="人際"><span class="icon-badge">🤝</span> 人際</button>
      <button class="chip" data-cat="生活"><span class="icon-badge">🏡</span> 生活</button>
      <button class="chip" data-cat="學校"><span class="icon-badge">🏫</span> 學校</button>
      <button class="chip" data-cat="服務"><span class="icon-badge">🤲</span> 服務</button>
      <button class="chip" data-cat="專注"><span class="icon-badge">🎯</span> 專注</button>
      <button class="chip" data-cat="學業"><span class="icon-badge">📚</span> 學業</button>
    </div>
  </div>

  <div class="panel">
    <h2><span class="badge-step">2</span>選擇成長階段(單選)</h2>
    <div class="stage-row" id="stageRow">
      <button class="stage" data-score="60"><span class="top-row"><span class="emoji">🌱</span><span class="num">60</span></span><span class="label">萌芽中</span></button>
      <button class="stage" data-score="70"><span class="top-row"><span class="emoji">🌿</span><span class="num">70</span></span><span class="label">穩步<br class="mobile-break">成長</span></button>
      <button class="stage" data-score="80"><span class="top-row"><span class="emoji">🌸</span><span class="num">80</span></span><span class="label">表現<br class="mobile-break">亮眼</span></button>
      <button class="stage" data-score="90"><span class="top-row"><span class="emoji">🍎</span><span class="num">90</span></span><span class="label">傑出<br class="mobile-break">優異</span></button>
      <button class="stage" data-score="100"><span class="top-row"><span class="emoji">⭐</span><span class="num">100</span></span><span class="label">全能<br class="mobile-break">之星</span></button>
    </div>
  </div>

  <div class="generate-wrap">
    <button id="genBtn">✨ 產生評語</button>
    <div id="hint">請先選擇項目與成長階段</div>
  </div>

  <div id="results"></div>

  <footer>
    這是一個<b>單一 HTML 檔案</b>,不需安裝、不需連網。<br>
    可以直接存到電腦或 <b>USB 隨身碟</b>帶著走,雙擊開啟即可使用。
    <br>
    <span class="credit-tag">🎨 Design by spppps@go.edu.tw</span>
  </footer>

<div class="toast" id="toast"></div>

  "品行":"#FF6FA0","生活":"#3FB8AC","學校":"#5B8DEF","人際":"#FFAA3D","學業":"#9B7EDE","服務":"#F0654F","專注":"#F0B429"

const CAT_EMOJI = {
  "品行":"🌟","生活":"🏡","學校":"🏫","人際":"🤝","學業":"📚","服務":"🤲","專注":"🎯"

let selectedCats = new Set();
let selectedScore = null;
let lastIndex = {}; // cat -> index used, to avoid immediate repeat on reroll

const catRow = document.getElementById('catRow');
const stageRow = document.getElementById('stageRow');
const hint = document.getElementById('hint');
const results = document.getElementById('results');

catRow.addEventListener('click', e=>{
  const btn = e.target.closest('.chip');
  if(!btn) return;
  const cat = btn.dataset.cat;
  if(selectedCats.has(cat)){
    selectedCats.delete(cat);
    btn.classList.remove('active');
  } else {
    selectedCats.add(cat);
    btn.classList.add('active');
  }
  updateHint();
});

stageRow.addEventListener('click', e=>{
  const btn = e.target.closest('.stage');
  if(!btn) return;
  stageRow.querySelectorAll('.stage').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  selectedScore = btn.dataset.score;
  updateHint();
});

function updateHint(){
  if(selectedCats.size===0 && !selectedScore){
    hint.textContent = "請先選擇項目與成長階段";
  } else if(selectedCats.size===0){
    hint.textContent = "還沒選擇項目喔(可複選) 🌟";
  } else if(!selectedScore){
    hint.textContent = "還沒選擇成長階段喔";
  } else {
    hint.textContent = `已選擇 ${selectedCats.size} 個項目 · 成長階段 ${selectedScore}`;
  }
}

// 連接詞:讓開頭句與結尾句之間的銜接方式更多元
const CONNECTORS = ["，", "；", "，且", "，同時", "，也", "，更"];

// 開場語:只有約 5%(二十次約出現一次)的機率會加在句首,其餘時候維持簡潔不加開場語
const PREFIXES = ["整體來看，", "老師觀察到，", "近期表現顯示，", "從日常表現看，", "綜合而言，", "值得一提的是，"];

function getPrefixInfo(){
  if(Math.random() >= 0.05){
    return {text:"", key:'p_none'};
  }
  const prefIdx = Math.floor(Math.random()*PREFIXES.length);
  return {text:PREFIXES[prefIdx], key:`p${prefIdx}`};
}

function pickComment(cat, score, avoidKey){
  const opens = OPENINGS[cat][score];
  const ends = ENDINGS[cat][score];
  let key, text;
  do{
    const openIdx = Math.floor(Math.random()*opens.length);
    const endIdx = Math.floor(Math.random()*ends.length);
    const connIdx = Math.floor(Math.random()*CONNECTORS.length);
    const prefix = getPrefixInfo();
    key = `${openIdx}-${endIdx}-${connIdx}-${prefix.key}`;
    text = prefix.text + opens[openIdx] + CONNECTORS[connIdx] + ends[endIdx];
  } while(key === avoidKey);
  return {text, idx:key};
}

function buildEntry(cat){
  const {text, idx} = pickComment(cat, selectedScore, null);
  lastIndex[cat] = idx;
  const color = CAT_COLOR[cat];
  return `
    <div class="entry" data-cat="${cat}">
      <div class="entry-head"><span class="dot" style="background:${color};"></span>${CAT_EMOJI[cat]} ${cat}</div>
      <p class="comment-text">${text}</p>
      <div class="card-actions">
        <button class="mini-btn reroll-btn">🎲 換一句</button>
      </div>
    </div>
  `;
}

function renderMegaCard(){
  const catList = [...selectedCats];
  const titleText = catList.length > 1
    ? `📝 評語組合 · ${selectedScore}分`
    : `📝 ${catList[0]}評語 · ${selectedScore}分`;

  const card = document.createElement('div');
  card.className = 'result-card';
  card.innerHTML = `
    <div class="tape">${titleText}</div>
    <div class="body">
      ${catList.map(buildEntry).join('')}
      <div class="card-footer">
        <button class="mini-btn copy-all-btn">📋 複製全部評語</button>
      </div>
    </div>
  `;
  return card;
}

document.getElementById('genBtn').addEventListener('click', ()=>{
  if(selectedCats.size===0 || !selectedScore){
    updateHint();
    hint.style.color = '#FF6FA0';
    setTimeout(()=>{hint.style.color='';}, 900);
    return;
  }
  results.innerHTML = '';
  lastIndex = {};
  results.appendChild(renderMegaCard());
});

results.addEventListener('click', e=>{
  const entry = e.target.closest('.entry');

  if(entry && e.target.closest('.reroll-btn')){
    const cat = entry.dataset.cat;
    const {text, idx} = pickComment(cat, selectedScore, lastIndex[cat]);
    lastIndex[cat] = idx;
    entry.querySelector('.comment-text').textContent = text;
  }

  if(e.target.closest('.copy-all-btn')){
    const entries = [...results.querySelectorAll('.entry')];
    const all = entries.map(el=>`【${el.dataset.cat}】${el.querySelector('.comment-text').textContent}`).join('\n');
    copyText(all);
  }
});

function copyText(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);

  if(ok){
    showToast('已複製到剪貼簿 ✅');
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>showToast('已複製到剪貼簿 ✅'))
      .catch(()=>showToast('複製失敗,請手動選取文字'));
  } else {
    showToast('複製失敗,請手動選取文字');
  }
}

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove('show'), 1600);
}

// 自動縮放:螢幕寬度比設計稿窄時,整體內容依比例縮小(最多縮到可用寬度的95%),
// 避免按鈕被迫換行。手機版(600px以下)已有專屬版面,不套用縮放。
const AUTO_SCALE_REF_WIDTH = 960;
function applyAutoScale(){
  const wrap = document.querySelector('.wrap');
  if(window.innerWidth < 601){
    wrap.style.zoom = '';
    return;
  }
  const available = window.innerWidth * 0.95;
  const scale = Math.min(1, available / AUTO_SCALE_REF_WIDTH);
  wrap.style.zoom = scale;
}
window.addEventListener('resize', applyAutoScale);
applyAutoScale();
</script>
</body>
